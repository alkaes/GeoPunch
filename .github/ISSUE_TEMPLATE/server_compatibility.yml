name: Server compatibility
description: GeoPunch can't sign in to, read from or punch on your OrangeHRM server.
labels: ["server-compat", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        OrangeHRM installations differ in version, configuration and what's in front of them (proxies, single sign-on, firewalls). This form collects what's needed to tell which part is the problem.

        **Don't post your server address, username or password.** Describe the setup instead, for example "self-hosted OrangeHRM 5.6 on HTTPS behind nginx".

  - type: dropdown
    id: symptom
    attributes:
      label: What fails?
      multiple: true
      options:
        - Saving the server connection (sign-in fails)
        - Sign-in works, then I'm signed out or asked again
        - Punch in or punch out is rejected
        - Punches are sent but don't appear in OrangeHRM
        - Attendance or Monthly view is empty or wrong
        - Leave balances or requests are missing or wrong
        - Holidays or the work week are wrong
        - Profile photo or company logo is missing
        - Something else
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: Error message
      description: The exact text GeoPunch showed (from the notice, the Server connection page or the Log tab).
      placeholder: "Sign-in failed: …"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: OrangeHRM version
      description: Footer of the OrangeHRM web page, or user menu → About.
      placeholder: "5.7"
    validations:
      required: true

  - type: dropdown
    id: hosting
    attributes:
      label: How is the server run?
      options:
        - Self-hosted by my company
        - Self-hosted by me
        - OrangeHRM cloud (Starter or paid)
        - The public OrangeHRM demo
        - Don't know
    validations:
      required: true

  - type: checkboxes
    id: login
    attributes:
      label: How do you sign in on the OrangeHRM web page?
      options:
        - label: Username and password on the OrangeHRM login page
        - label: A company single sign-on page (Google, Microsoft, Okta, LDAP…)
        - label: Two-factor authentication or a VPN is required
        - label: The web page works on the same phone's browser

  - type: dropdown
    id: time-change
    attributes:
      label: Can employees change the time when punching in/out?
      description: Admin → Attendance → Configuration → "Employee can change current time when punching in/out". Ask your administrator if you can't see it.
      options:
        - "Yes"
        - "No"
        - Don't know
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: GeoPunch version
      description: Settings → About & Legal.
      placeholder: "1.2"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Proxies, custom URL paths (for example the server lives under /hr/), recent server upgrades, what you already tried.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This report contains no server address, credentials or employee details.
          required: true
